# Minimal consumer workflow — drop into .github/workflows/ of any repo.
name: BrassCoders
on:
  push:
    branches: [main]
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: CopperSunDev/brasscoders-action@v1
